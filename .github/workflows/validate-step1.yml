name: Validate step 1
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/engine.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
